<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Base tile with subtle border -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Viewfinder corner marks -->
  <path d="M 12 18 L 12 12 L 18 12" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 30 12 L 36 12 L 36 18" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 36 30 L 36 36 L 30 36" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 18 36 L 12 36 L 12 30" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central camera / snip target -->
  <circle cx="24" cy="24" r="6" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />
  <circle cx="24" cy="24" r="2.5" fill="#38bdf8" />
</svg>

