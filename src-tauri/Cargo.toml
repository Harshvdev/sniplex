[package]
name = "sniplex"
version = "1.0.0-alpha"
description = "Sniplex modern screen capture and markup utility"
authors = ["thesky"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "sniplex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
base64 = "0.22"
zbus = "5"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", default-features = false }
gtk = { version = "0.18", default-features = false }
gobject-sys = "0.18"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
incremental = true
panic = "abort"
